<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 278 278" role="img" aria-labelledby="title desc">
  <title id="title">Blue T shopping bag icon</title>
  <desc id="desc">A blue shopping bag with arched handles and a white letter T.</desc>
  <defs>
    <linearGradient id="front" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2458ef"/>
      <stop offset=".52" stop-color="#123bd4"/>
      <stop offset="1" stop-color="#071da9"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102bbd"/>
      <stop offset="1" stop-color="#071477"/>
    </linearGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#174de9"/>
      <stop offset="1" stop-color="#0825b7"/>
    </linearGradient>
    <linearGradient id="letter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#f1f4ff"/>
    </linearGradient>
  </defs>

  <!-- Rear handle -->
  <path d="M91 75 C91 36 108 10 133 9 C160 8 177 35 180 68
           L165 72 C162 45 150 25 134 25 C118 25 107 44 106 75 Z"
        fill="url(#handle)"/>
  <!-- Front handle -->
  <path d="M82 78 C82 38 101 7 128 5 C157 3 176 31 181 69
           L167 74 C163 42 148 20 129 21 C110 22 98 45 97 78 Z"
        fill="url(#handle)"/>
  <path d="M96 77 C97 47 109 25 128 21 C147 18 161 38 166 69"
        fill="none" stroke="#315ff4" stroke-width="3" opacity=".45"/>

  <!-- Right side panel -->
  <path d="M199 45 L238 62 L254 229 Q256 244 242 251 L202 269 L187 85 Z"
        fill="url(#side)"/>
  <!-- Main bag body -->
  <path d="M45 74 L199 45 L221 250 Q223 266 208 272 L42 252 Q22 250 23 232 L43 88 Q44 78 45 74 Z"
        fill="url(#front)"/>
  <!-- subtle front highlight -->
  <path d="M47 78 L197 50" stroke="#5a7cff" stroke-width="2" opacity=".28"/>
  <!-- White T -->
  <path d="M76 105 L166 89 L164 121 L117 129 L105 230 L75 226 L87 135 L72 138 Z"
        fill="url(#letter)"/>
</svg>
